name: Deploy Mis Cartas Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  detect-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect catalog updates
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python scripts/collection_discovery.py
          python scripts/enrich_collections.py
          python scripts/detect_updates.py
          python validate_catalog.py catalogo.json

      - name: Commit detected updates
        run: |
          if git diff --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json portadas/actualizaciones.json portadas/descubrimiento.json portadas/discovery_snapshot.json portadas/enriquecimiento.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar catálogo automáticamente"
          git push

  deploy:
    needs: detect-updates
    if: ${{ needs.detect-updates.result == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build verified public site
        run: python scripts/build_site.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
